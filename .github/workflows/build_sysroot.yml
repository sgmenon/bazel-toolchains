name: Build and publish sysroots

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      image_type:
        required: true
        type: string
      version:
        required: true
        type: string
      gcc_version:
        required: false
        default: 13.4.0
        type: string

permissions:
  contents: write

jobs:
  build_sysroots:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publish-sysroots')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Build sysroot
        run: |
          set -Eeuo pipefail
          ./sysroot/build.sh "${{ inputs.arch }}" ./sysroot "${{ inputs.image_type }}" ${{ inputs.gcc_version }}
      - name: Upload sysroot to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: sysroots-v${{ inputs.version }}
          ASSET: sysroot/toolchain-${{ inputs.image_type }}-gcc${{ inputs.gcc_version }}-${{ inputs.arch }}.tar.xz
          ASSET_NAME: toolchain-${{ inputs.image_type }}-gcc${{ inputs.gcc_version }}-${{ inputs.arch }}-${{ inputs.version }}.tar.xz
        run: |
          set -Eeuo pipefail
          # Create the release if it doesn't already exist (idempotent across matrix jobs)
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Sysroots v${{ inputs.version }}" \
              --notes "Prebuilt sysroot/toolchain tarballs (version ${{ inputs.version }})." \
              --draft
          fi
          # Rename asset so the uploaded file has the versioned name, then upload (clobber replaces existing)
          cp "${ASSET}" "${ASSET_NAME}"
          gh release upload "${TAG}" "${ASSET_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
